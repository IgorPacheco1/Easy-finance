    <rect x="87" y="148" width="338" height="236" rx="72" fill="#1F1410"/>
    <rect x="292" y="225" width="154" height="82" rx="41" fill="#E0A458"/>
    <circle cx="338" cy="266" r="18" fill="#1F1410"/>
  </g>
</svg>
