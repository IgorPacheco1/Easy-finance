version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - "type: ci"
      - "area: devops"

  # Dependências Maven do backend (Spring Boot, PostgreSQL, JaCoCo...).
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - "type: chore"
      - "area: backend"

  # ---------------------------------------------------------------
  # O Dependabot falha se o diretório não existir. Descomente cada
  # bloco quando a pasta correspondente for criada:
