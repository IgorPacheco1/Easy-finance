version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - "type: ci"
      - "area: devops"

  # Dependências Maven do backend (Spring Boot, PostgreSQL, JaCoCo...).
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - "type: chore"
      - "area: backend"

  # Dependências npm do front-end (React, Vite, TypeScript...). Atualizações pequenas
  # (minor e patch) chegam agrupadas num PR só, para não lotar a fila.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - "type: chore"
      - "area: frontend"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------
  # O Dependabot falha se o diretório não existir. Descomente o
  # bloco quando o arquivo correspondente for criado:
  #
  # Quando existir Dockerfile (produção):
  # - package-ecosystem: docker
  #   directory: /backend
  #   schedule:
  #     interval: weekly
  #   commit-message:
  #     prefix: "build"
  # ---------------------------------------------------------------
