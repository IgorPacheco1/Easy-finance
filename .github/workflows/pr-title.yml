name: PR Title

# Com squash merge, o título do PR vira a mensagem do commit na main.
# Este workflow garante que ele siga Conventional Commits.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # O nome do job ("pr-title") é o check obrigatório na ruleset da main.
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            A descrição do título deve começar com letra minúscula.
            Exemplo: "feat: adicionar cadastro de categorias".
