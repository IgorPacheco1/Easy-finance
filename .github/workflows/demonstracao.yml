name: Demonstração

# Publica o modo demonstração (#162, ADR-0030) no GitHub Pages a cada merge na main que mexe no app.
# É o app só no navegador, com a API falsa (MSW) e dados de exemplo: nenhum servidor, nenhum dado
# de verdade. Os testes já rodaram no CI do PR; aqui é só montar e publicar.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/demonstracao.yml'
  # Botão "Run workflow" na aba Actions, para publicar de novo sem precisar de um commit.
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; uma nova espera a anterior terminar em vez de cancelá-la no meio.
concurrency:
  group: demonstracao
  cancel-in-progress: false

jobs:
  montar:
    name: montar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      # Dá o endereço do site (base_path, ex.: /Guarda) para o build usar como base.
      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build da demonstração
        working-directory: web
        env:
          BASE_DA_DEMONSTRACAO: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:demonstracao

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-demonstracao

  publicar:
    name: publicar
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Só este job pode publicar no Pages (o token da Actions recebe a permissão aqui, e não no
    # workflow inteiro).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
