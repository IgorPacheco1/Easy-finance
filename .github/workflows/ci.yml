name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job ("build") é o check obrigatório da ruleset da main.
  # Ele sempre roda e passa quando backend/ ou web/ ainda não existem,
  # para não travar os PRs enquanto o projeto é construído.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Detectar o que existe no repositório
        id: detect
        run: |
          if [ -f backend/pom.xml ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

      - name: Nada para compilar ainda
        if: steps.detect.outputs.backend != 'true' && steps.detect.outputs.web != 'true'
        run: echo "backend/ (M1) e web/ (M3) ainda não existem. Nada para compilar."

      # ---------------- Backend (Java) ----------------
      - name: Configurar JDK 21
        if: steps.detect.outputs.backend == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend - build e testes
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend
        run: ./mvnw -B -ntp verify

      # Mostra a cobertura total na página do workflow (aba Summary do run). Roda mesmo se o
      # verify falhar (always), para mostrar a cobertura quando ela fica abaixo do mínimo (#69).
      - name: Backend - resumo da cobertura (JaCoCo)
        if: always() && steps.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 { lc+=$9; lm+=$8; bc+=$7; bm+=$6 }
              END {
                printf "## Cobertura de testes (JaCoCo)\n\n| Métrica | Cobertura |\n|---|---|\n"
                printf "| Linhas | %.1f%% |\n", (lc+lm) ? 100*lc/(lc+lm) : 0
                printf "| Branches | %.1f%% |\n", (bc+bm) ? 100*bc/(bc+bm) : 0
              }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório do JaCoCo não encontrado." >> "$GITHUB_STEP_SUMMARY"
          fi

      # O relatório completo (HTML) fica disponível para download no run, por 14 dias.
      - name: Backend - publicar relatório de cobertura
        if: always() && steps.detect.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Backend - publicar relatórios de teste (em caso de falha)
        if: failure() && steps.detect.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      # ---------------- Front-end (Node) ----------------
      # Usa a mesma versão do Node fixada para quem desenvolve (web/.nvmrc, ADR-0011).
      # O cache guarda os pacotes baixados, chaveado pelo package-lock.json: enquanto o lock
      # não mudar, o npm ci não precisa baixar tudo de novo.
      - name: Configurar Node.js
        if: steps.detect.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - instalar dependências
        if: steps.detect.outputs.web == 'true'
        working-directory: web
        run: npm ci

      # Os tipos do app (src/api/esquema.d.ts) precisam bater com a API (ADR-0028). O teste
      # EspecificacaoDaApiParaOAppTests grava backend/target/openapi.json no verify do backend;
      # aqui os tipos são gerados de novo a partir dele e não pode sobrar diferença.
      - name: Web - conferir os tipos da API
        if: steps.detect.outputs.web == 'true' && steps.detect.outputs.backend == 'true'
        working-directory: web
        run: |
          npm run api:tipos
          if ! git diff --exit-code -- src/api/esquema.d.ts; then
            echo "::error file=web/src/api/esquema.d.ts::Os tipos do app não batem com a API. Rode './mvnw verify' em backend/, depois 'npm run api:tipos' em web/, e faça commit do esquema.d.ts."
            exit 1
          fi

      # Sem --if-present: os scripts existem e são obrigatórios. Se um deles sumir,
      # o CI deve falhar, e não pular a etapa em silêncio.
      - name: Web - lint
        if: steps.detect.outputs.web == 'true'
        working-directory: web
        run: npm run lint

      # Testes com cobertura (#152): falha se a cobertura cair abaixo do mínimo (vite.config.ts).
      - name: Web - testes
        if: steps.detect.outputs.web == 'true'
        working-directory: web
        run: npm run test:cobertura

      # Como no backend: resumo na aba Summary e relatório HTML para baixar, mesmo se falhar.
      - name: Web - resumo da cobertura
        if: always() && steps.detect.outputs.web == 'true'
        working-directory: web
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              console.log("## Cobertura de testes do app (Vitest)\n");
              console.log("| Métrica | Cobertura |\n|---|---|");
              console.log(`| Linhas | ${t.lines.pct}% |`);
              console.log(`| Branches | ${t.branches.pct}% |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura do app não encontrado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Web - publicar relatório de cobertura
        if: always() && steps.detect.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-web
          path: web/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Web - build
        if: steps.detect.outputs.web == 'true'
        working-directory: web
        run: npm run build

      # Modo demonstração (#162, ADR-0030): o build normal não pode levar o MSW nem os dados de
      # exemplo, e o da demonstração não pode levar o endereço de uma API de verdade, mesmo com um
      # VITE_API_URL no ambiente (o endereço abaixo é falso, só para conferir que ele não entra).
      - name: Web - build da demonstração e separação dos builds
        if: steps.detect.outputs.web == 'true'
        working-directory: web
        env:
          VITE_API_URL: https://api-de-verdade.invalid/api/v1
          BASE_DA_DEMONSTRACAO: /Easy-finance/
        run: |
          npm run build:demonstracao
          falhou=0
          if grep -rlE "mockServiceWorker|setupWorker|nada é salvo" dist; then
            echo "::error::O build normal (dist/) tem código da demonstração."
            falhou=1
          fi
          if grep -rl "api-de-verdade.invalid" dist-demonstracao; then
            echo "::error::O build da demonstração tem o endereço de uma API de verdade."
            falhou=1
          fi
          for arquivo in mockServiceWorker.js 404.html; do
            if [ ! -f "dist-demonstracao/$arquivo" ]; then
              echo "::error::Falta dist-demonstracao/$arquivo."
              falhou=1
            fi
          done
          if [ -f dist-demonstracao/sw.js ]; then
            echo "::error::O build da demonstração tem o service worker do app (o PWA deve ficar desligado)."
            falhou=1
          fi
          exit $falhou
