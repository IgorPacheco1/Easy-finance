# Perfil dos testes automatizados. Ativado com @ActiveProfiles("test").
#
# Não há datasource aqui: o Testcontainers sobe um PostgreSQL descartável, e a
# TestcontainersConfiguration liga o app como guarda_app e o Flyway como dono das tabelas
# (dois usuários, como em produção: ADR-0034).
# Fora isso, os testes usam a configuração base (application.yaml), a mesma de produção,
# para que eles verifiquem o comportamento real, inclusive os padrões de segurança.

logging:
  level:
    # Menos ruído na saída dos testes.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
