# Configuração base do Guardá: vale para TODOS os ambientes.
#
# Regras deste arquivo:
# - Nada de segredos nem de endereços de banco. Eles chegam por variável de ambiente
#   (em produção: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# - Dois usuários do banco (ADR-0034): SPRING_DATASOURCE_* é o guarda_app (só lê e grava dados)
#   e SPRING_FLYWAY_USER/SPRING_FLYWAY_PASSWORD é o dono das tabelas, usado só pelas migrations.
#   Sem o usuário do Flyway, as migrations tentam rodar como guarda_app e a aplicação nem sobe.
# - Os padrões aqui são os mais seguros. Os perfis (application-<perfil>.yaml) só relaxam
#   o que for preciso para o próprio ambiente.
# - Não há perfil padrão (spring.profiles.default) de propósito: sem perfil e sem variáveis,
#   a aplicação falha ao subir em vez de tentar se conectar a um banco local por engano.
#   No desenvolvimento, ative o perfil com SPRING_PROFILES_ACTIVE=dev.

spring:
  application:
    name: guarda

  jpa:
    # Fecha a conexão com o banco ao fim da camada de serviço, e não só depois que a resposta
    # HTTP termina. Evita consultas escondidas na serialização e conexões presas.
    open-in-view: false
    hibernate:
      # O schema só muda por migration Flyway. O Hibernate apenas confere se as entidades
      # batem com as tabelas e, se não baterem, a aplicação nem sobe.
      ddl-auto: validate

  session:
    # Sessão no PostgreSQL (ADR-0020). As tabelas vêm da migration V5, nunca do script automático.
    jdbc:
      initialize-schema: never
    # 30 dias sem uso; cada requisição renova o prazo.
    timeout: 30d

server:
  servlet:
    session:
      cookie:
        # O JavaScript não lê o cookie (HttpOnly), ele só viaja em requisições do próprio site
        # (SameSite=Strict) e, fora do dev, só por HTTPS (Secure).
        http-only: true
        same-site: strict
        path: /
        secure: true

guarda:
  login:
    # Limite de falhas de login (ADR-0022). Cada falha conta durante a janela, que também é o
    # tempo de bloqueio. Por IP o limite é maior, para não travar uma rede compartilhada.
    max-falhas-por-email: 5
    max-falhas-por-ip: 20
    janela: 15m
  limites:
    # Limites em memória (ADR-0035). Limite geral: requisições à API (/api/**) por IP e por janela.
    # Fora da API (o /actuator/health, por exemplo) nada é contado.
    max-requisicoes: 120
    janela-das-requisicoes: 1m
    # Contas novas por IP e por janela. Só conta o cadastro que deu certo.
    max-cadastros: 3
    janela-dos-cadastros: 1h
    # O IP é o da conexão. Atrás do proxy da hospedagem (M11), ligar a leitura do IP real com
    # server.forward-headers-strategy, junto com a lista de proxies confiáveis.

springdoc:
  # Especificação OpenAPI (/v3/api-docs) e Swagger UI desligados por padrão: em produção,
  # quem está de fora não deve ver o mapa da API. O perfil dev liga os dois (ADR-0010).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      # Só o health fica acessível por HTTP. Outros endpoints (env, beans, metrics...)
      # revelam detalhes internos e não devem ficar abertos.
      exposure:
        include: health
      # Esconde a página /actuator, que lista os endpoints disponíveis.
      discovery:
        enabled: false
  endpoint:
    health:
      # Para quem está de fora, só "UP" ou "DOWN". Os detalhes (banco, disco)
      # aparecem apenas no perfil dev.
      show-details: never
